# Builds and tests on Linux (GCC), macOS (Apple Clang) and Windows (MSVC)
# on every push/PR to main. Every push to main also publishes a new GitHub
# Release ("Build 1", "Build 2", ...) with the packaged builds attached.
# Pull requests are built and tested but never released.
#
# Packaging needs include(packaging/packaging.cmake) as the last line of
# CMakeLists.txt. Each release then has one download per platform:
#   WingIt-Windows.zip (Wing It.exe), WingIt-macOS.zip (Wing It.app),
#   WingIt-Linux.tar.gz (WingIt).
#
# Caching:
#   - Dependencies downloaded by FetchContent (raylib, json, glm, ...) are kept
#     between runs, so they aren't re-downloaded.
#   - Compiled object files are reused with ccache on Linux and macOS, so only
#     changed files are recompiled.
#   - vcpkg's build of curl is reused on Windows.
# Caches can be viewed or deleted under the repo's Actions tab → Caches.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # run manually from the Actions tab

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  HOMEBREW_NO_AUTO_UPDATE: 1  # skip Homebrew's slow self-update before "brew install"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # A build marked allow_failure still runs and shows its result, but a failure
    # there doesn't block the release. Windows is marked this way until the code
    # compiles with MSVC; remove the flag once it builds cleanly.
    continue-on-error: ${{ matrix.allow_failure == true }}

    strategy:
      # Report results for every configuration even if one fails.
      fail-fast: false

      # "package: true" marks which builds get attached to a release.
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            cpack_generator: TGZ
            package: true
            cmake_args: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          - name: macos
            os: macos-latest          # Apple Silicon (arm64)
            c_compiler: clang
            cpp_compiler: clang++
            cpack_generator: ZIP      # Finder unzips straight to "Wing It.app"
            package: true
            cmake_args: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          - name: windows-msvc
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            cpack_generator: ZIP
            package: true
            allow_failure: true
            # Static curl from vcpkg, linked against the normal (DLL) MSVC runtime,
            # so the release zip doesn't need extra curl DLLs next to the .exe.
            cmake_args: -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

    steps:
      - uses: actions/checkout@v6

      # ---------------------------------------------------------------- caches

      # Dependencies downloaded by FetchContent. Restored here, saved right after
      # Configure. Editing CMakeLists.txt (e.g. bumping a dependency version)
      # starts a new cache that builds on the previous one.
      # If Configure ever fails inside build/_deps after GitHub updates its
      # runners, delete the "deps-" caches under Actions → Caches.
      - name: Restore downloaded dependencies
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      # Compiled object files for your code and its dependencies; ccache reuses
      # anything whose source hasn't changed. Not used on Windows: the Visual
      # Studio generator doesn't support compiler launchers like ccache.
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}

      # vcpkg's compiled curl (several minutes to build from scratch). A fresh copy
      # is saved each run because vcpkg rebuilds whenever GitHub updates the
      # runner's compiler; old copies expire on their own.
      - name: Restore vcpkg packages
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ matrix.name }}-

      # --------------------------------------------------- system dependencies

      # raylib builds GLFW from source, which needs the X11 / OpenGL development
      # headers; find_package(CURL) needs the libcurl development package.
      # GitHub's Ubuntu runners include neither.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            libcurl4-openssl-dev

      # curl and OpenGL come with the macOS SDK. Apple's clang has no OpenMP
      # runtime, so libomp comes from Homebrew; OpenMP_ROOT tells CMake's
      # find_package(OpenMP) where Homebrew put it.
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # Windows has no curl development package either. vcpkg is preinstalled on
      # GitHub's Windows runners; this builds curl (or reuses the cached build)
      # and points CMake at it.
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/vcpkg-cache" | Out-Null
          vcpkg install curl:x64-windows-static-md
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Saved straight away so it's kept even if the Windows build fails later.
      - name: Save vcpkg packages
        if: runner.os == 'Windows'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # ----------------------------------------------------------------- build

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          ${{ matrix.cmake_args }}

      # Saved straight after Configure (which does the downloading), so it's kept
      # even if a later step fails. Skipped when nothing changed.
      - name: Save downloaded dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Your build command, plus --config so Windows (Visual Studio generator,
      # multi-config) builds Release instead of its default Debug.
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        if: matrix.package
        run: cpack --config build/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -G ${{ matrix.cpack_generator }} -B dist

      - name: Upload package
        if: matrix.package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build                                   # waits for every build
    if: github.ref == 'refs/heads/main'            # pushes to main, not pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      # Each run gets its own tag (build-1, build-2, ...) pointing at the commit
      # that was built. The body tells players which file to download; the list
      # of commits since the previous build is added below it.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          body: |
            ## Download

            Pick the file for your computer under **Assets** below. (The "Source code" files are added by GitHub to every release; you don't need them.)

            | | File | Then |
            |---|---|---|
            | **Windows** | `WingIt-Windows.zip` | Right-click → **Extract All**, open the folder, run **Wing It.exe**. If Windows says it protected your PC, click **More info → Run anyway**. |
            | **macOS** (Apple Silicon) | `WingIt-macOS.zip` | Double-click to unzip, then open **Wing It.app**. The first time, macOS blocks it: go to **System Settings → Privacy & Security** and click **Open Anyway**. |
            | **Linux** | `WingIt-Linux.tar.gz` | Extract it and run `./WingIt` in the `WingIt-Linux` folder. |
